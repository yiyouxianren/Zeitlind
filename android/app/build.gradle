plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def _storeFile = file(System.getenv('KEYSTORE') ?: keystoreProperties['storeFile'] ?: 'vvex.jks')
def _storePassword = System.getenv('KEYSTORE_PASSWORD') ?: keystoreProperties['storePassword']
def _keyAlias = System.getenv('KEY_ALIAS') ?: keystoreProperties['keyAlias']
def _keyPassword = System.getenv('KEY_PASSWORD') ?: keystoreProperties['keyPassword']

android {
    namespace 'com.Zeitlind.bill'
    compileSdk 36
    ndkVersion '27.0.12077973'

    // Kotlin 侧用 BuildConfig.DEBUG 门控 ADB 调试接收器
    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    sourceSets { main.java.srcDirs += 'src/main/kotlin' }

    defaultConfig {
        applicationId 'com.Zeitlind.bill'
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // ffmpeg_kit_flutter_new_audio 要求 minSdk 24
        minSdk 24
        multiDexEnabled true
        // 仅打包 arm64（目标设备为 arm64；多 ABI 是包体巨大的主因）
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            storeFile _storeFile
            storePassword _storePassword
            keyAlias _keyAlias
            keyPassword _keyPassword
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // 包体压缩：R8 代码压缩/优化 + 资源压缩
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
    }
}

flutter { source '../..' }

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.21'
    implementation 'androidx.core:core-ktx:1.12.0'
}
